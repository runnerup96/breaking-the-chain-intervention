[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "breaking-the-chain-intervention"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch==2.5.1",
    "transformers==4.53.0",
    "datasets==3.0.2",
    "accelerate==1.0.1",
    "pandas==2.2.3",
    "numpy==2.1.2",
    "scipy==1.15.3",
    "scikit-learn==1.6.1",
    "tqdm==4.66.5",
    "json5==0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["datasets_for_intervention/test_intervention"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
include = ["datasets_for_intervention*", "analysis*"]
